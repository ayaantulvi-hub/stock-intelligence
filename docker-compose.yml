services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stockintel
      POSTGRES_DB: stockintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockintel -d stockintel"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
