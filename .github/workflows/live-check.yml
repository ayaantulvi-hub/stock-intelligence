name: Live access check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/src/stockintel/live_check.py
      - .github/workflows/live-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run alembic upgrade head
      - run: uv run python -m stockintel.live_check
