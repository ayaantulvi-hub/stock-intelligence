name: Update data
# Runs only when there is work, to stay inside GitHub's free 2,000 minutes a month (UTC times):
# - After the US close, 11 runs to refresh all 480 prices (Tiingo allows about 45 an hour).
# - 10:50, four hours before the open: the daily decisions. 12:25 and 13:25 are backups, and
#   whichever run first finds the decisions due does the daily work.
# - Three runs during the US session for market prices and news.
# Day trading needs no job: its page fetches live prices itself.
on:
  schedule:
    - cron: "25 21-23 * * 1-5"
    - cron: "25 0-7 * * 2-6"
    - cron: "50 10 * * 2-6"
    - cron: "25 12,13 * * 1-5"
    - cron: "25 15,17,19 * * 1-5"
  workflow_dispatch:
    inputs:
      prices:
        description: Update prices
        type: boolean
        default: true
      forecasts:
        description: Write forecasts (only works before the US market opens)
        type: boolean
        default: false
      filings_and_economic:
        description: Also update filings and economic data
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STOCKINTEL_CACHE: .dbcopy
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # A copy of the database, so each job downloads only new rows. See localcache.py.
      - uses: actions/cache/restore@v4
        with:
          path: backend/.dbcopy
          key: dbcopy-${{ github.run_id }}
          restore-keys: dbcopy-
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: uv run --no-dev alembic upgrade head
      - run: uv run --no-dev python -m stockintel.ingest universe
      # Any run can do the daily work, so one missed trigger can't lose a day's decisions.
      - name: Are today's decisions due?
        id: due
        run: uv run --no-dev python -m stockintel.forecast due >> "$GITHUB_OUTPUT"
      - name: Prices
        if: github.event_name == 'schedule' && github.event.schedule != '50 10 * * 2-6' || inputs.prices
        run: uv run --no-dev python -m stockintel.ingest prices --limit 45
      - name: Filings
        # Runs even if prices failed: one feed's failure must not stop the others.
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest filings
      - name: Company facts
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest facts
      - name: Insider trades
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest insiders --limit 2500
      - name: Past company sizes
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest history
      - name: Government policy actions
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest policy
      - name: Market prices
        if: ${{ !cancelled() }}
        run: uv run --no-dev python -m stockintel.ingest markets
      - name: News
        if: ${{ !cancelled() }}
        run: uv run --no-dev python -m stockintel.ingest news
      - name: AI reads the news
        if: ${{ !cancelled() }}
        run: uv run --no-dev python -m stockintel.ingest judge
      - name: Big investors
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest funds
      - name: Fed dates
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest fed
      - name: Economic data
        # Runs even if prices failed: one feed's failure must not stop the others.
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest economic
      - name: Economic release dates
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest releases
      - name: Short interest
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest short
      - name: Install the PDF reader for Congress reports
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.filings_and_economic) }}
        run: sudo apt-get install -y -qq poppler-utils
      - name: Congress trades
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest congress --limit 100
      - name: Cross-check sources
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.conflicts
      - name: Forecasts
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.forecasts) }}
        run: uv run --no-dev python -m stockintel.forecast daily
      - name: Expert review
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.forecasts || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.experts
      - name: Check company figures
        if: ${{ !cancelled() && (steps.due.outputs.daily == 'yes' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.audit
      - name: Alerts
        id: alerts
        if: ${{ !cancelled() }}
        run: |
          uv run --no-dev python -m stockintel.monitor > alerts.txt
          if [ -s alerts.txt ]; then echo "found=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Send alerts
        if: ${{ !cancelled() && steps.alerts.outputs.found == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "Stock alerts $(date -u +%F)" --body-file alerts.txt
      - name: Report
        if: always()
        run: uv run --no-dev python -m stockintel.report
      # Saved even after a failure, so the next job doesn't download everything again.
      - uses: actions/cache/save@v4
        if: ${{ always() }}
        with:
          path: backend/.dbcopy
          key: dbcopy-${{ github.run_id }}
