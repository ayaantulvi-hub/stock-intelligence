name: Update data
on:
  workflow_dispatch:
    inputs:
      prices:
        description: Update prices
        type: boolean
        default: true
      forecasts:
        description: Write forecasts (only works before the US market opens)
        type: boolean
        default: false
      filings_and_economic:
        description: Also update filings and economic data
        type: boolean
        default: false
  schedule:
    # Prices are started hourly by cron-job.org, because GitHub often skips scheduled runs.
    # See docs/decisions.md. 45 stocks a run stays under Tiingo's 50 an hour.
    # Filings and economic data: once a day.
    - cron: "50 10 * * 2-6"
permissions:
  contents: read
  issues: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: uv run --no-dev alembic upgrade head
      - run: uv run --no-dev python -m stockintel.ingest universe
      - name: Prices
        if: github.event_name == 'schedule' && github.event.schedule != '50 10 * * 2-6' || inputs.prices
        run: uv run --no-dev python -m stockintel.ingest prices --limit 45
      - name: Filings
        # Runs even if prices failed: one feed's failure must not stop the others.
        if: ${{ !cancelled() && (github.event.schedule == '50 10 * * 2-6' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest filings
      - name: Company facts
        if: ${{ !cancelled() && (github.event.schedule == '50 10 * * 2-6' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest facts
      - name: Insider trades
        if: ${{ !cancelled() && (github.event.schedule == '50 10 * * 2-6' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest insiders --limit 2500
      - name: Past company sizes
        if: ${{ !cancelled() && (github.event.schedule == '50 10 * * 2-6' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest history
      - name: Fed dates
        if: ${{ !cancelled() && (github.event.schedule == '50 10 * * 2-6' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest fed
      - name: Economic data
        # Runs even if prices failed: one feed's failure must not stop the others.
        if: ${{ !cancelled() && (github.event.schedule == '50 10 * * 2-6' || inputs.filings_and_economic) }}
        run: uv run --no-dev python -m stockintel.ingest economic
      - name: Forecasts
        if: ${{ !cancelled() && (github.event.schedule == '50 10 * * 2-6' || inputs.forecasts) }}
        run: uv run --no-dev python -m stockintel.forecast daily
      - name: Alerts
        id: alerts
        if: ${{ !cancelled() }}
        run: |
          uv run --no-dev python -m stockintel.monitor > alerts.txt
          if [ -s alerts.txt ]; then echo "found=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Send alerts
        if: ${{ !cancelled() && steps.alerts.outputs.found == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "Stock alerts $(date -u +%F)" --body-file alerts.txt
      - name: Report
        if: always()
        run: uv run --no-dev python -m stockintel.report
