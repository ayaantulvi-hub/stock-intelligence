name: Update data
# Started every hour by cron-job.org, because GitHub's own schedule skipped most runs. Each run:
# - fills every stock's latest close from Alpaca, then 45 more Tiingo stocks (its hourly limit);
# - adds new yearly company sizes from SEC filings and the Fed funds rate from FRED.
# The one GitHub schedule left is a backup if cron-job.org fails.
# The limit that matters is Neon's free 100 compute hours and 5 GB a month, not GitHub minutes.
on:
  schedule:
    - cron: "20 11 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STOCKINTEL_CACHE: .dbcopy
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # A copy of the database, so each job downloads only new rows. See localcache.py.
      - uses: actions/cache/restore@v4
        with:
          path: backend/.dbcopy
          key: dbcopy-${{ github.run_id }}
          restore-keys: dbcopy-
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: uv run --no-dev alembic upgrade head
      - name: Stock list
        run: uv run --no-dev python -m stockintel.ingest universe
      - name: Latest closes for every stock
        if: ${{ !cancelled() }}
        run: uv run --no-dev python -m stockintel.ingest alpaca-closes
      - name: Prices
        if: ${{ !cancelled() }}
        run: uv run --no-dev python -m stockintel.ingest prices --limit 45
      - name: Past company sizes
        if: ${{ !cancelled() }}
        run: uv run --no-dev python -m stockintel.ingest history
      - name: Fed funds rate
        if: ${{ !cancelled() }}
        run: uv run --no-dev python -m stockintel.ingest economic
      # Saved even after a failure, so the next job doesn't download everything again.
      - uses: actions/cache/save@v4
        if: ${{ always() }}
        with:
          path: backend/.dbcopy
          key: dbcopy-${{ github.run_id }}
