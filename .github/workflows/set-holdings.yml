name: Set holdings
on:
  workflow_dispatch:
    inputs:
      holdings:
        description: "JSON list: ticker, shares, buy_price, and optionally stop_price, sell_by"
        required: true
      sales:
        description: "Optional JSON list of real sale prices: ticker, price"
        required: false
        default: "[]"
permissions:
  contents: read
jobs:
  set:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The holdings are read from the trigger's own file, never put in env, because the
      # public job log prints every env value at the top of each step.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: uv run --no-dev python -m stockintel.set_holdings
