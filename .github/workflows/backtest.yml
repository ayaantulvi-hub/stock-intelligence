name: Backtest
on:
  workflow_dispatch:
    inputs:
      quant_only:
        description: "Run only the quant lab studies"
        type: boolean
        default: false
  schedule:
    - cron: "40 12 * * 6"
permissions:
  contents: read
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STOCKINTEL_CACHE: .dbcopy
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # A copy of the database, so each job downloads only new rows. See localcache.py.
      - uses: actions/cache/restore@v4
        with:
          path: backend/.dbcopy
          key: dbcopy-${{ github.run_id }}
          restore-keys: dbcopy-
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: uv run --no-dev alembic upgrade head
      - if: ${{ !inputs.quant_only }}
        run: uv run --no-dev python -m stockintel.backtest
      - if: ${{ !inputs.quant_only }}
        run: uv run --no-dev python -m stockintel.forecast evaluate
      - if: ${{ !inputs.quant_only }}
        run: uv run --no-dev python -m stockintel.compare
      - if: ${{ !inputs.quant_only }}
        run: uv run --no-dev python -m stockintel.regime
      - if: ${{ !inputs.quant_only }}
        run: uv run --no-dev python -m stockintel.stops
      - if: ${{ !inputs.quant_only }}
        run: uv run --no-dev python -m stockintel.candles
      - if: ${{ !inputs.quant_only }}
        run: uv run --no-dev python -m stockintel.overrides
      - name: Quant lab studies
        run: uv run --no-dev python -m stockintel.quant.run
      # Weekly: delete what no longer feeds decisions, then give the space back.
      - if: ${{ !inputs.quant_only }}
        run: uv run --no-dev python -m stockintel.retention
      # Saved even after a failure, so the next job doesn't download everything again.
      - uses: actions/cache/save@v4
        if: ${{ always() }}
        with:
          path: backend/.dbcopy
          key: dbcopy-${{ github.run_id }}
