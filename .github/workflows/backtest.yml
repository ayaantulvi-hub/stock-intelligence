name: Backtest
on:
  workflow_dispatch:
  schedule:
    - cron: "40 12 * * 6"
permissions:
  contents: read
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STOCKINTEL_CACHE: .dbcopy
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # A copy of the database, so each job downloads only new rows. See localcache.py.
      - uses: actions/cache@v4
        with:
          path: backend/.dbcopy
          key: dbcopy-${{ github.run_id }}
          restore-keys: dbcopy-
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: uv run --no-dev alembic upgrade head
      - run: uv run --no-dev python -m stockintel.backtest
      - run: uv run --no-dev python -m stockintel.forecast evaluate
      - run: uv run --no-dev python -m stockintel.compare
      - run: uv run --no-dev python -m stockintel.stops
      - run: uv run --no-dev python -m stockintel.candles
