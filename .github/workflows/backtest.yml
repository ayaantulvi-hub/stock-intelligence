name: Quant studies
# Weekly: rerun every quant lab study on the latest prices and store the results, then remove
# repeated price rows and old logs.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 12 * * 6"
permissions:
  contents: read
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  studies:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STOCKINTEL_CACHE: .dbcopy
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # A copy of the database, so each job downloads only new rows. See localcache.py.
      - uses: actions/cache/restore@v4
        with:
          path: backend/.dbcopy
          key: dbcopy-${{ github.run_id }}
          restore-keys: dbcopy-
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: uv run --no-dev alembic upgrade head
      - name: Quant lab studies
        run: uv run --no-dev python -m stockintel.quant.run
      - name: Summary of stored results
        run: uv run --no-dev python -m stockintel.results_summary
      - name: Remove repeats and old logs
        run: uv run --no-dev python -m stockintel.retention
      # Saved even after a failure, so the next job doesn't download everything again.
      - uses: actions/cache/save@v4
        if: ${{ always() }}
        with:
          path: backend/.dbcopy
          key: dbcopy-${{ github.run_id }}
