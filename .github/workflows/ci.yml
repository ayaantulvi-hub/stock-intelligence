name: Tests
# Not run on pull requests: the repository is public, and nobody else should be able to start jobs.
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockintel
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: stockintel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockintel" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://stockintel:ci-only@localhost:5432/stockintel_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stock-intelligence .
      - name: Refuses to start in production without a password
        run: |
          if docker run --rm -e DATABASE_URL=postgresql://x:y@127.0.0.1/z stock-intelligence; then
            exit 1
          fi
      - name: Serves the dashboard behind the password
        run: |
          docker run -d --name app -p 8000:8000 -e DATABASE_URL=postgresql://x:y@127.0.0.1/z \
            -e DASHBOARD_PASSWORD=ci-only stock-intelligence
          sleep 8
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/)" = 401
          curl -sf -u owner:ci-only localhost:8000/ | grep -q "Stock Intelligence"
