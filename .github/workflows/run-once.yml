name: Run one step
# Runs a single light step on demand, to check it without the full jobs. Output is summary
# figures only, so it is safe in this public log.
on:
  workflow_dispatch:
    inputs:
      step:
        description: Which step
        type: choice
        options: [results-summary, economic, alpaca-closes, retention-dry, retention]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: uv run --no-dev alembic upgrade head
      - if: inputs.step == 'results-summary'
        run: uv run --no-dev python -m stockintel.results_summary
      - if: inputs.step == 'economic' || inputs.step == 'alpaca-closes'
        run: uv run --no-dev python -m stockintel.ingest ${{ inputs.step }}
      - if: inputs.step == 'retention-dry'
        run: uv run --no-dev python -m stockintel.retention --dry
      - if: inputs.step == 'retention'
        run: uv run --no-dev python -m stockintel.retention
