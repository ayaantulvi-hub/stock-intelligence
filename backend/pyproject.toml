[project]
name = "stockintel"
version = "0.1.0"
description = "Stock Intelligence Platform backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "apscheduler>=3.10,<4",
  "exchange-calendars>=4.13.2",
  "fastapi>=0.115",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
    "ta-lib>=0.8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
